<script>
    // Live Auto-lock Countdown Simulator (2:00 -> 0:00)
    let totalSeconds = 120;
    const countdownEl = document.getElementById('countdown');

    setInterval(() => {
      if (totalSeconds > 0) {
        totalSeconds--;
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        const formattedSeconds = seconds < 10 ? '0' + seconds : seconds;
        countdownEl.textContent = `Bloqueia em ${minutes}:${formattedSeconds}`;
      } else {
        countdownEl.textContent = 'Bloqueado';
      }
    }, 1000);

    // Toggle Secret Masking
    function toggleSecret(elementId, realValue, btn) {
      const el = document.getElementById(elementId);
      const icon = btn.querySelector('.material-symbols-outlined');
      const isMasked = el.textContent.trim().startsWith('•');

      if (isMasked) {
        el.textContent = realValue;
        el.classList.remove('tracking-widest');
        icon.textContent = 'visibility_off';
      } else {
        el.textContent = '•'.repeat(realValue.length > 12 ? 16 : (realValue.length > 5 ? 12 : 3));
        el.classList.add('tracking-widest');
        icon.textContent = 'visibility';
      }
    }

    // Copy to clipboard with toast notification
    function copyValue(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('Copiado para a área de transferência');
        const icon = btn.querySelector('.material-symbols-outlined');
        const originalIcon = icon.textContent;
        icon.textContent = 'done';
        setTimeout(() => {
          icon.textContent = originalIcon;
        }, 1500);
      }).catch(() => {
        showToast('Item copiado');
      });
    }

    // Show temporary feedback toast
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');
      toastText.textContent = message;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2000);
    }
  </script>

<button id="proxima" type="button">Ver próxima tela</button>
<script>
(function(){
  var telas=document.querySelectorAll('.tela'),i=0;
  document.getElementById('proxima').addEventListener('click',function(){
    telas[i].classList.remove('ativa');
    i=(i+1)%telas.length;
    telas[i].classList.add('ativa');
  });
})();
</script>
